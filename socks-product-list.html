<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>袜子专区</title>
  <style>
    :root {
      --bg-start: #f6f6f6;
      --bg-end: #ececec;
      --surface: #ffffff;
      --text-main: #111111;
      --text-subtle: #666666;
      --line: #dddddd;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      --radius-panel: 28px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 48px;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .hero {
      margin-bottom: 20px;
      padding: 28px;
      border: 1px solid #ebebeb;
      border-radius: var(--radius-panel);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .hero__eyebrow {
      margin: 0 0 10px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero__title {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.05;
    }

    .hero__description {
      margin: 0;
      max-width: 620px;
      color: var(--text-subtle);
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding: 18px 20px;
      border: 1px solid #ebebeb;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
    }

    .toolbar__group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .toolbar__label {
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar__chip {
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      background: #ffffff;
      color: #333333;
      font: inherit;
    }

    .toolbar__chip.is-active {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .toolbar__result {
      color: #666666;
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      min-height: 120px;
    }

    .product-grid.is-empty {
      grid-template-columns: 1fr;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid #e8e8e8;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 16px 36px rgba(17, 17, 17, 0.06);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
    }

    .product-card__media {
      position: relative;
      min-height: 232px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f5f5f5 0%, #e7e7e7 100%);
    }

    .product-card__badge {
      position: absolute;
      top: 18px;
      left: 18px;
      margin: 0;
      border-radius: var(--radius-pill);
      padding: 8px 12px;
      background: #111111;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .product-card__tag {
      position: absolute;
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #d7d7d7;
      border-radius: var(--radius-pill);
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #555555;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .product-card__sock {
      width: 168px;
      height: 168px;
      border-radius: 32px;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d9d9d9 52%, #b8b8b8 100%);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #4a4a4a;
      text-transform: uppercase;
      transition: transform 220ms ease;
    }

    .product-card:hover .product-card__sock {
      transform: scale(1.05);
    }

    .product-card__content {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 22px;
    }

    .product-card__series {
      margin: 0 0 8px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .product-card__title {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .product-card__name {
      margin: 0;
      color: #5f5f5f;
      font-size: 14px;
    }

    .product-card__description {
      margin: 0;
      color: var(--text-subtle);
      line-height: 1.7;
    }

    .product-card__price {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .product-card__price-current {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .product-card__price-original {
      color: #8a8a8a;
      font-size: 15px;
      text-decoration: line-through;
    }

    .product-card__sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .product-card__size {
      min-width: 72px;
      border: 1px solid #d4d4d4;
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      background: #ffffff;
      color: #333333;
      cursor: pointer;
      font: inherit;
      transition: border-color 180ms ease, background-color 180ms ease, color 180ms ease;
    }

    .product-card__size:hover {
      border-color: #111111;
    }

    .product-card__size.is-selected {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .product-card__cta {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      background: #111111;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background-color 160ms ease, opacity 160ms ease;
    }

    .product-card__cta:hover {
      background: #222222;
    }

    .product-card__cta:active {
      transform: translateY(1px) scale(0.99);
    }

    .empty-state {
      padding: 42px 28px;
      border: 1px dashed #d6d6d6;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      color: #5f5f5f;
      text-align: center;
      font-size: 16px;
    }

    @media (max-width: 960px) {
      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      body {
        padding-inline: 14px;
      }

      .toolbar {
        align-items: flex-start;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="hero__eyebrow">Cotton Daily</p>
      <h1 class="hero__title">袜子专区</h1>
      <p class="hero__description">精选黑白灰日常袜、运动袜与轻量通勤款，延续简约电商风格，专注舒适穿着与基础百搭感。</p>
    </section>

    <section class="toolbar" data-toolbar>
      <div class="toolbar__group">
        <span class="toolbar__label">分类</span>
        <button class="toolbar__chip is-active" type="button" data-filter="all">全部</button>
        <button class="toolbar__chip" type="button" data-filter="sport">运动袜</button>
        <button class="toolbar__chip" type="button" data-filter="daily">日常袜</button>
        <button class="toolbar__chip" type="button" data-filter="crew">中筒袜</button>
        <button class="toolbar__chip" type="button" data-filter="no-show">船袜</button>
      </div>
      <div class="toolbar__group">
        <span class="toolbar__label">排序</span>
        <button class="toolbar__chip is-active" type="button" data-sort="recommended">推荐</button>
        <button class="toolbar__chip" type="button" data-sort="price-asc">价格从低到高</button>
        <button class="toolbar__chip" type="button" data-sort="price-desc">价格从高到低</button>
        <button class="toolbar__chip" type="button" data-sort="newest">最新上架</button>
      </div>
      <p class="toolbar__result" data-result-count></p>
    </section>

    <section class="product-grid" data-product-grid></section>
  </main>

  <script>
    const FILTER_KEY = {
      ALL: "all",
      SPORT: "sport",
      DAILY: "daily",
      CREW: "crew",
      NO_SHOW: "no-show"
    };

    const SORT_KEY = {
      RECOMMENDED: "recommended",
      PRICE_ASC: "price-asc",
      PRICE_DESC: "price-desc",
      NEWEST: "newest"
    };

    const products = [
      {
        id: "sock-01",
        series: "Cotton Daily",
        title: "极简中筒袜",
        categoryKey: FILTER_KEY.CREW,
        categoryLabel: "中筒袜",
        price: 39,
        originalPrice: 59,
        discount: "32% OFF",
        description: "柔软透气面料，适合日常通勤与居家穿着。",
        sizes: ["35-38", "39-42", "43-45"],
        isRecommended: true,
        releaseDate: "2026-07-15"
      },
      {
        id: "sock-02",
        series: "Active Base",
        title: "轻压运动袜",
        categoryKey: FILTER_KEY.SPORT,
        categoryLabel: "运动袜",
        price: 49,
        originalPrice: 69,
        discount: "29% OFF",
        description: "包裹感更强，适合慢跑和日常训练。",
        sizes: ["39-42", "43-45"],
        isRecommended: true,
        releaseDate: "2026-07-14"
      },
      {
        id: "sock-03",
        series: "Daily Soft",
        title: "柔棉短袜",
        categoryKey: FILTER_KEY.DAILY,
        categoryLabel: "日常袜",
        price: 25,
        originalPrice: 39,
        discount: "36% OFF",
        description: "低调百搭，适合夏季与日常轻松穿着。",
        sizes: ["35-38", "39-42"],
        isRecommended: false,
        releaseDate: "2026-07-10"
      },
      {
        id: "sock-04",
        series: "Motion Fit",
        title: "速干训练袜",
        categoryKey: FILTER_KEY.SPORT,
        categoryLabel: "运动袜",
        price: 45,
        originalPrice: 58,
        discount: "22% OFF",
        description: "快干面料帮助维持长时间训练舒适度。",
        sizes: ["39-42", "43-45"],
        isRecommended: false,
        releaseDate: "2026-07-13"
      },
      {
        id: "sock-05",
        series: "City Basic",
        title: "通勤罗口袜",
        categoryKey: FILTER_KEY.DAILY,
        categoryLabel: "日常袜",
        price: 35,
        originalPrice: 49,
        discount: "29% OFF",
        description: "更适合正装与通勤鞋型的基础搭配。",
        sizes: ["35-38", "39-42", "43-45"],
        isRecommended: true,
        releaseDate: "2026-07-12"
      },
      {
        id: "sock-06",
        series: "Lite Step",
        title: "云感船袜",
        categoryKey: FILTER_KEY.NO_SHOW,
        categoryLabel: "船袜",
        price: 29,
        originalPrice: 42,
        discount: "31% OFF",
        description: "轻薄贴脚，适合浅口鞋与夏日轻装搭配。",
        sizes: ["35-38", "39-42"],
        isRecommended: false,
        releaseDate: "2026-07-11"
      }
    ];

    const toolbar = document.querySelector("[data-toolbar]");
    const productGrid = document.querySelector("[data-product-grid]");
    const resultCount = document.querySelector("[data-result-count]");
    const cartFeedbackTimers = new Map();
    let activeFilter = FILTER_KEY.ALL;
    let activeSort = SORT_KEY.RECOMMENDED;

    function createCardMarkup(product) {
      const sizeButtons = product.sizes
        .map((size, index) => {
          const selectedClass = index === 0 ? " is-selected" : "";
          const pressedState = index === 0 ? "true" : "false";
          return `<button class="product-card__size${selectedClass}" type="button" aria-pressed="${pressedState}" data-size>${size}</button>`;
        })
        .join("");

      const recommendationTag = product.isRecommended
        ? '<span class="product-card__tag">推荐</span>'
        : `<span class="product-card__tag">${product.categoryLabel}</span>`;

      return `
        <article class="product-card" data-product-card data-product-id="${product.id}">
          <div class="product-card__media">
            <span class="product-card__badge">${product.discount}</span>
            ${recommendationTag}
            <div class="product-card__sock" aria-hidden="true">SOCKS</div>
          </div>
          <div class="product-card__content">
            <div>
              <p class="product-card__series">${product.series}</p>
              <h2 class="product-card__title">${product.title}</h2>
              <p class="product-card__name">${product.categoryLabel}</p>
            </div>
            <p class="product-card__description">${product.description}</p>
            <div class="product-card__price">
              <span class="product-card__price-current">¥${product.price}</span>
              <span class="product-card__price-original">¥${product.originalPrice}</span>
            </div>
            <div class="product-card__sizes" aria-label="${product.title} 可选尺码">
              ${sizeButtons}
            </div>
            <div class="product-card__footer">
              <span class="product-card__name">${product.releaseDate}</span>
            </div>
            <button class="product-card__cta" type="button" data-cart-button>加入购物车</button>
          </div>
        </article>
      `;
    }

    function getVisibleProducts() {
      const filteredProducts = activeFilter === FILTER_KEY.ALL
        ? [...products]
        : products.filter((product) => product.categoryKey === activeFilter);

      if (activeSort === SORT_KEY.RECOMMENDED) {
        filteredProducts.sort((left, right) => {
          if (left.isRecommended !== right.isRecommended) {
            return Number(right.isRecommended) - Number(left.isRecommended);
          }

          return right.releaseDate.localeCompare(left.releaseDate);
        });
      } else if (activeSort === SORT_KEY.PRICE_ASC) {
        filteredProducts.sort((left, right) => left.price - right.price);
      } else if (activeSort === SORT_KEY.PRICE_DESC) {
        filteredProducts.sort((left, right) => right.price - left.price);
      } else if (activeSort === SORT_KEY.NEWEST) {
        filteredProducts.sort((left, right) => right.releaseDate.localeCompare(left.releaseDate));
      }

      return filteredProducts;
    }

    function syncToolbarState() {
      const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));
      const sortButtons = Array.from(document.querySelectorAll("[data-sort]"));

      filterButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === activeFilter);
      });

      sortButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.sort === activeSort);
      });
    }

    function bindCardInteractions() {
      const productCards = Array.from(productGrid.querySelectorAll("[data-product-card]"));

      productCards.forEach((card) => {
        const sizeButtons = Array.from(card.querySelectorAll("[data-size]"));
        const cartButton = card.querySelector("[data-cart-button]");
        const productId = card.dataset.productId;

        sizeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            sizeButtons.forEach((sizeButton) => {
              sizeButton.classList.remove("is-selected");
              sizeButton.setAttribute("aria-pressed", "false");
            });

            button.classList.add("is-selected");
            button.setAttribute("aria-pressed", "true");
          });
        });

        cartButton.addEventListener("click", () => {
          cartButton.textContent = "已加入购物车";

          if (cartFeedbackTimers.has(productId)) {
            window.clearTimeout(cartFeedbackTimers.get(productId));
          }

          const timerId = window.setTimeout(() => {
            cartButton.textContent = "加入购物车";
            cartFeedbackTimers.delete(productId);
          }, 1500);

          cartFeedbackTimers.set(productId, timerId);
        });
      });
    }

    function renderProducts() {
      const visibleProducts = getVisibleProducts();
      const isEmpty = visibleProducts.length === 0;

      productGrid.classList.toggle("is-empty", isEmpty);
      productGrid.innerHTML = isEmpty
        ? '<div class="empty-state" data-empty-state>当前分类暂无商品</div>'
        : visibleProducts.map(createCardMarkup).join("");
      resultCount.textContent = `共 ${visibleProducts.length} 件商品`;
      syncToolbarState();

      if (!isEmpty) {
        bindCardInteractions();
      }
    }

    toolbar.addEventListener("click", (event) => {
      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) {
        activeFilter = filterButton.dataset.filter;
        renderProducts();
        return;
      }

      const sortButton = event.target.closest("[data-sort]");
      if (sortButton) {
        activeSort = sortButton.dataset.sort;
        renderProducts();
      }
    });

    renderProducts();
  </script>
</body>
</html>
