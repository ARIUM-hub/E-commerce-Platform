<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>袜子专区</title>
  <style>
    :root {
      --bg-start: #f6f6f6;
      --bg-end: #ececec;
      --surface: #ffffff;
      --text-main: #111111;
      --text-subtle: #666666;
      --line: #dddddd;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      --radius-panel: 28px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 48px;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }

    body.is-cart-drawer-open {
      overflow: hidden;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .hero {
      margin-bottom: 20px;
      padding: 28px;
      border: 1px solid #ebebeb;
      border-radius: var(--radius-panel);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .hero__eyebrow {
      margin: 0 0 10px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero__title {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.05;
    }

    .hero__description {
      margin: 0;
      max-width: 620px;
      color: var(--text-subtle);
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding: 18px 20px;
      border: 1px solid #ebebeb;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
    }

    .toolbar__group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .toolbar__label {
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar__chip {
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      background: #ffffff;
      color: #333333;
      font: inherit;
    }

    .toolbar__chip.is-active {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .toolbar__result {
      color: #666666;
      font-size: 14px;
    }

    .toolbar__cart {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      padding: 10px 14px;
      border: 1px solid #e3e3e3;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      color: #444444;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .toolbar__cart:hover {
      border-color: #111111;
      transform: translateY(-1px);
    }

    .toolbar__cart-label {
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toolbar__cart-count {
      min-width: 34px;
      border-radius: 999px;
      padding: 6px 10px;
      background: #111111;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .toolbar__cart-summary {
      color: #5f5f5f;
      font-size: 14px;
      white-space: nowrap;
    }

    .cart-drawer__action {
      border: 1px solid #d4d4d4;
      border-radius: var(--radius-pill);
      padding: 8px 12px;
      background: #ffffff;
      color: #333333;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 180ms ease, color 180ms ease, opacity 180ms ease;
    }

    .cart-drawer__action:hover:not(:disabled) {
      border-color: #111111;
      color: #111111;
    }

    .cart-drawer__action:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .cart-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.32);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px 22px;
      background: rgba(255, 255, 255, 0.98);
      border-left: 1px solid #ececec;
      box-shadow: -24px 0 48px rgba(0, 0, 0, 0.12);
      transform: translateX(100%);
      transition: transform 220ms ease;
      z-index: 20;
    }

    .cart-drawer[data-open="true"] {
      transform: translateX(0);
    }

    .cart-drawer[data-open="true"] + .cart-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-drawer__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .cart-drawer__eyebrow {
      margin: 0 0 8px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cart-drawer__title {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .cart-drawer__meta {
      margin: 10px 0 0;
      color: #666666;
      font-size: 14px;
    }

    .cart-drawer__close {
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      background: #f2f2f2;
      color: #222222;
      font: inherit;
      cursor: pointer;
    }

    .cart-drawer__items {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .cart-drawer__item {
      border: 1px solid #e9e9e9;
      border-radius: 20px;
      padding: 16px;
      background: #ffffff;
    }

    .cart-drawer__item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cart-drawer__item-title {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
    }

    .cart-drawer__item-detail {
      margin: 0;
      color: #5f5f5f;
      font-size: 14px;
      line-height: 1.7;
    }

    .cart-drawer__item-subtotal {
      margin: 12px 0 0;
      color: #111111;
      font-size: 18px;
      font-weight: 700;
    }

    .cart-drawer__item-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
    }

    .cart-drawer__qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cart-drawer__qty-button {
      width: 34px;
      height: 34px;
      border: 1px solid #d6d6d6;
      border-radius: 999px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      cursor: pointer;
    }

    .cart-drawer__qty-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .cart-drawer__qty-value {
      min-width: 24px;
      text-align: center;
      color: #333333;
      font-size: 14px;
      font-weight: 700;
    }

    .cart-drawer__remove {
      border: 0;
      background: transparent;
      color: #7a7a7a;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .cart-drawer__empty {
      padding: 24px 20px;
      border: 1px dashed #dadada;
      border-radius: 22px;
      background: #fcfcfc;
      color: #666666;
      text-align: center;
      line-height: 1.7;
    }

    .cart-drawer__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 6px;
    }

    .cart-drawer__footer-copy {
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
    }

    .cart-drawer__footer-total {
      color: #111111;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      min-height: 120px;
    }

    .product-grid.is-empty {
      grid-template-columns: 1fr;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid #e8e8e8;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 16px 36px rgba(17, 17, 17, 0.06);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
    }

    .product-card__media {
      position: relative;
      min-height: 232px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f5f5f5 0%, #e7e7e7 100%);
    }

    .product-card__badge {
      position: absolute;
      top: 18px;
      left: 18px;
      margin: 0;
      border-radius: var(--radius-pill);
      padding: 8px 12px;
      background: #111111;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .product-card__tag {
      position: absolute;
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #d7d7d7;
      border-radius: var(--radius-pill);
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #555555;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .product-card__sock {
      width: 176px;
      height: 176px;
      display: grid;
      place-items: center;
      transition: transform 220ms ease;
    }

    .product-card:hover .product-card__sock {
      transform: scale(1.05);
    }

    .product-card__illustration {
      width: 176px;
      height: 176px;
      filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.16));
    }

    .product-card__content {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 22px;
    }

    .product-card__series {
      margin: 0 0 8px;
      color: #7a7a7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .product-card__title {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .product-card__name {
      margin: 0;
      color: #5f5f5f;
      font-size: 14px;
    }

    .product-card__description {
      margin: 0;
      color: var(--text-subtle);
      line-height: 1.7;
    }

    .product-card__price {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .product-card__price-current {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .product-card__price-original {
      color: #8a8a8a;
      font-size: 15px;
      text-decoration: line-through;
    }

    .product-card__rating {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .product-card__stars {
      color: #4a4a4a;
      font-size: 13px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .product-card__rating-value {
      color: #111111;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .product-card__reviews {
      color: #666666;
      font-size: 13px;
      white-space: nowrap;
    }

    .product-card__top-rated {
      display: inline-flex;
      align-items: center;
      border: 1px solid #dddddd;
      border-radius: 999px;
      padding: 4px 8px;
      background: #f3f3f3;
      color: #444444;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .product-card__sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .product-card__size {
      min-width: 72px;
      border: 1px solid #d4d4d4;
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      background: #ffffff;
      color: #333333;
      cursor: pointer;
      font: inherit;
      transition: border-color 180ms ease, background-color 180ms ease, color 180ms ease;
    }

    .product-card__size:hover {
      border-color: #111111;
    }

    .product-card__size.is-selected {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .product-card__cta {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      background: #111111;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background-color 160ms ease, opacity 160ms ease;
    }

    .product-card__cta:hover {
      background: #222222;
    }

    .product-card__cta:active {
      transform: translateY(1px) scale(0.99);
    }

    .empty-state {
      padding: 42px 28px;
      border: 1px dashed #d6d6d6;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      color: #5f5f5f;
      text-align: center;
      font-size: 16px;
    }

    @media (max-width: 960px) {
      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      body {
        padding-inline: 14px;
      }

      .toolbar {
        align-items: flex-start;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="hero__eyebrow">Cotton Daily</p>
      <h1 class="hero__title">袜子专区</h1>
      <p class="hero__description">精选黑白灰日常袜、运动袜与轻量通勤款，延续简约电商风格，专注舒适穿着与基础百搭感。</p>
    </section>

    <section class="toolbar" data-toolbar>
      <div class="toolbar__group">
        <span class="toolbar__label">分类</span>
        <button class="toolbar__chip is-active" type="button" data-filter="all">全部</button>
        <button class="toolbar__chip" type="button" data-filter="sport">运动袜</button>
        <button class="toolbar__chip" type="button" data-filter="daily">日常袜</button>
        <button class="toolbar__chip" type="button" data-filter="crew">中筒袜</button>
        <button class="toolbar__chip" type="button" data-filter="no-show">船袜</button>
      </div>
      <div class="toolbar__group">
        <span class="toolbar__label">排序</span>
        <button class="toolbar__chip is-active" type="button" data-sort="recommended">推荐</button>
        <button class="toolbar__chip" type="button" data-sort="price-asc">价格从低到高</button>
        <button class="toolbar__chip" type="button" data-sort="price-desc">价格从高到低</button>
        <button class="toolbar__chip" type="button" data-sort="newest">最新上架</button>
      </div>
      <button class="toolbar__cart" type="button" data-cart-toggle aria-label="打开购物车" aria-expanded="false" aria-controls="cart-drawer">
        <span class="toolbar__cart-label">购物车</span>
        <span class="toolbar__cart-count" data-cart-count>0</span>
        <span class="toolbar__cart-summary" data-cart-summary>购物车 0 件</span>
      </button>
      <p class="toolbar__result" data-result-count></p>
    </section>

    <section class="product-grid" data-product-grid></section>
  </main>

  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer data-open="false" aria-hidden="true">
    <div class="cart-drawer__header">
      <div>
        <p class="cart-drawer__eyebrow">Cart State</p>
        <h2 class="cart-drawer__title">购物车明细</h2>
        <p class="cart-drawer__meta" data-cart-drawer-meta>共 0 件商品</p>
      </div>
      <button class="cart-drawer__close" type="button" data-cart-close aria-label="关闭购物车">关闭</button>
    </div>
    <div class="cart-drawer__items" data-cart-drawer-items>
      <div class="cart-drawer__empty" data-cart-empty-state>购物车还是空的</div>
    </div>
    <div class="cart-drawer__footer">
      <div>
        <p class="cart-drawer__footer-copy">你可以继续加购，抽屉会同步展示当前匿名购物车状态。</p>
        <p class="cart-drawer__footer-total" data-cart-total>¥0</p>
      </div>
      <button class="cart-drawer__action" type="button" data-clear-cart>清空购物车</button>
    </div>
  </aside>
  <div class="cart-backdrop" data-cart-backdrop></div>

  <script>
    const FILTER_KEY = {
      ALL: "all",
      SPORT: "sport",
      DAILY: "daily",
      CREW: "crew",
      NO_SHOW: "no-show"
    };

    const SORT_KEY = {
      RECOMMENDED: "recommended",
      PRICE_ASC: "price-asc",
      PRICE_DESC: "price-desc",
      NEWEST: "newest"
    };

    const toolbar = document.querySelector("[data-toolbar]");
    const productGrid = document.querySelector("[data-product-grid]");
    const resultCount = document.querySelector("[data-result-count]");
    const cartToggleButton = document.querySelector("[data-cart-toggle]");
    const cartCount = document.querySelector("[data-cart-count]");
    const cartSummary = document.querySelector("[data-cart-summary]");
    const cartDrawer = document.querySelector("[data-cart-drawer]");
    const cartDrawerMeta = document.querySelector("[data-cart-drawer-meta]");
    const cartDrawerItems = document.querySelector("[data-cart-drawer-items]");
    const cartDrawerTotal = document.querySelector("[data-cart-total]");
    const cartCloseButton = document.querySelector("[data-cart-close]");
    const cartBackdrop = document.querySelector("[data-cart-backdrop]");
    const clearCartButton = document.querySelector("[data-clear-cart]");
    const cartFeedbackTimers = new Map();
    let activeFilter = FILTER_KEY.ALL;
    let activeSort = SORT_KEY.RECOMMENDED;
    const productCatalog = new Map();
    let cartState = { items: [] };
    let isCartDrawerOpen = false;
    let isCartMutationPending = false;

    function createSockIllustration(product) {
      const patternMarkup = {
        minimal: `
          <path d="M84 46h52" stroke="${product.visualAccent}" stroke-width="5" stroke-linecap="round" opacity="0.6" />
          <path d="M86 60h48" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.4" />
        `,
        sport: `
          <path d="M77 58c16 6 31 7 50 2" stroke="${product.visualAccent}" stroke-width="7" stroke-linecap="round" opacity="0.85" />
          <path d="M87 82c11 5 28 5 39 0" stroke="${product.visualAccent}" stroke-width="6" stroke-linecap="round" opacity="0.55" />
        `,
        soft: `
          <circle cx="101" cy="80" r="5" fill="${product.visualAccent}" opacity="0.45" />
          <circle cx="117" cy="92" r="4" fill="${product.visualAccent}" opacity="0.32" />
          <circle cx="129" cy="76" r="3.5" fill="${product.visualAccent}" opacity="0.25" />
        `,
        mesh: `
          <path d="M82 58l45 50" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.45" />
          <path d="M128 56l-30 42" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.4" />
          <path d="M79 82h52" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.35" />
        `,
        rib: `
          <path d="M92 44v48" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.45" />
          <path d="M106 42v51" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.5" />
          <path d="M120 44v47" stroke="${product.visualAccent}" stroke-width="4" stroke-linecap="round" opacity="0.45" />
        `,
        light: `
          <path d="M82 90c16-8 32-8 48 0" stroke="${product.visualAccent}" stroke-width="5" stroke-linecap="round" opacity="0.4" />
          <path d="M92 59h30" stroke="${product.visualAccent}" stroke-width="3.5" stroke-linecap="round" opacity="0.35" />
        `
      }[product.visualPattern];

      return `
        <svg class="product-card__illustration" viewBox="0 0 220 220" aria-hidden="true" role="presentation">
          <defs>
            <radialGradient id="halo-${product.id}" cx="50%" cy="46%" r="54%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.98)" />
              <stop offset="100%" stop-color="rgba(215,215,215,0.2)" />
            </radialGradient>
            <linearGradient id="sock-${product.id}" x1="50%" y1="20%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="${product.visualTone}" />
              <stop offset="100%" stop-color="${product.visualShadow}" />
            </linearGradient>
          </defs>
          <ellipse cx="110" cy="112" rx="78" ry="70" fill="url(#halo-${product.id})" />
          <ellipse cx="128" cy="184" rx="48" ry="12" fill="rgba(0, 0, 0, 0.12)" />
          <path d="M86 34h54c6 0 11 5 11 11v61c0 20 10 40 27 52 9 6 13 17 9 28-4 11-15 19-27 19h-38c-15 0-29-8-36-21l-17-29c-4-7-5-15-2-23l10-25c3-7 4-14 4-22V45c0-6 5-11 11-11Z" fill="url(#sock-${product.id})" />
          <path d="M86 49h54" stroke="rgba(255,255,255,0.35)" stroke-width="7" stroke-linecap="round" />
          <path d="M78 137c10 7 20 10 32 10h45c9 0 17 5 20 13" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round" />
          ${patternMarkup}
          <path d="M87 35h52v20H87z" fill="rgba(255,255,255,0.16)" />
          <path d="M81 103c4 4 10 6 16 6" stroke="rgba(0,0,0,0.12)" stroke-width="4" stroke-linecap="round" />
        </svg>
      `;
    }

    function formatRatingValue(ratingValue) {
      return Number(ratingValue).toFixed(1);
    }

    function formatReviewCount(reviewCount) {
      return `${reviewCount.toLocaleString("en-US")} reviews`;
    }

    function createRatingMarkup(product) {
      const topRatedMarkup = product.isTopRated
        ? '<span class="product-card__top-rated" data-top-rated>Top rated</span>'
        : "";

      return `
        <div class="product-card__rating" data-rating-band>
          <span class="product-card__stars" data-rating-stars aria-hidden="true">★★★★★</span>
          <span class="product-card__rating-value" data-rating-value>${formatRatingValue(product.ratingValue)}</span>
          <span class="product-card__reviews" data-review-count>${formatReviewCount(product.reviewCount)}</span>
          ${topRatedMarkup}
        </div>
      `;
    }

    function createCardMarkup(product) {
      const sizeButtons = product.sizes
        .map((size, index) => {
          const selectedClass = index === 0 ? " is-selected" : "";
          const pressedState = index === 0 ? "true" : "false";
          return `<button class="product-card__size${selectedClass}" type="button" aria-pressed="${pressedState}" data-size>${size}</button>`;
        })
        .join("");

      const recommendationTag = product.isRecommended
        ? '<span class="product-card__tag">推荐</span>'
        : `<span class="product-card__tag">${product.categoryLabel}</span>`;

      return `
        <article class="product-card" data-product-card data-product-id="${product.id}">
          <div class="product-card__media">
            <span class="product-card__badge">${product.discount}</span>
            ${recommendationTag}
            <div class="product-card__sock" aria-hidden="true">${createSockIllustration(product)}</div>
          </div>
          <div class="product-card__content">
            <div>
              <p class="product-card__series">${product.series}</p>
              <h2 class="product-card__title">${product.title}</h2>
              <p class="product-card__name">${product.categoryLabel}</p>
            </div>
            <div class="product-card__price">
              <span class="product-card__price-current">¥${product.price}</span>
              <span class="product-card__price-original">¥${product.originalPrice}</span>
            </div>
            ${createRatingMarkup(product)}
            <p class="product-card__description">${product.description}</p>
            <div class="product-card__sizes" aria-label="${product.title} 可选尺码">
              ${sizeButtons}
            </div>
            <div class="product-card__footer">
              <span class="product-card__name">${product.releaseDate}</span>
            </div>
            <button class="product-card__cta" type="button" data-cart-button>加入购物车</button>
          </div>
        </article>
      `;
    }

    async function fetchProducts() {
      const params = new URLSearchParams({
        filter: activeFilter,
        sort: activeSort
      });
      const response = await fetch(`/api/products?${params.toString()}`);

      if (!response.ok) {
        throw new Error("Failed to load products");
      }

      const payload = await response.json();
      resultCount.textContent = `共 ${payload.meta.count} 件商品`;
      return payload.items;
    }

    function getCartQuantity(items) {
      return items.reduce((total, item) => total + item.quantity, 0);
    }

    function findProduct(productId) {
      return productCatalog.get(productId) || null;
    }

    function syncProductCatalog(products) {
      products.forEach((product) => {
        productCatalog.set(product.id, product);
      });
    }

    function createCartItemMarkup(item) {
      const product = findProduct(item.productId);
      const title = product ? product.title : "已选商品";
      const series = product ? product.series : "Anonymous Cart";
      const sizeText = `尺码 ${item.size}`;
      const quantityText = `x${item.quantity}`;
      const unitPrice = product ? product.price : 0;
      const subtotal = unitPrice * item.quantity;

      return `
        <article class="cart-drawer__item" data-cart-item>
          <div class="cart-drawer__item-meta">
            <span>${series}</span>
            <span>${quantityText}</span>
          </div>
          <h3 class="cart-drawer__item-title">${title}</h3>
          <p class="cart-drawer__item-detail">${sizeText}</p>
          <p class="cart-drawer__item-subtotal">¥${subtotal}</p>
          <div class="cart-drawer__item-actions">
            <div class="cart-drawer__qty-controls">
              <button class="cart-drawer__qty-button" type="button" data-cart-decrease data-product-id="${item.productId}" data-size="${item.size}" aria-label="减少 ${title} 数量"${item.quantity <= 1 || isCartMutationPending ? " disabled" : ""}>-</button>
              <span class="cart-drawer__qty-value">${item.quantity}</span>
              <button class="cart-drawer__qty-button" type="button" data-cart-increase data-product-id="${item.productId}" data-size="${item.size}" aria-label="增加 ${title} 数量"${isCartMutationPending ? " disabled" : ""}>+</button>
            </div>
            <button class="cart-drawer__remove" type="button" data-cart-remove data-product-id="${item.productId}" data-size="${item.size}" aria-label="移除 ${title}"${isCartMutationPending ? " disabled" : ""}>移除</button>
          </div>
        </article>
      `;
    }

    function renderCartDrawer() {
      const quantity = getCartQuantity(cartState.items);
      const total = cartState.items.reduce((sum, item) => {
        const product = findProduct(item.productId);
        return sum + ((product ? product.price : 0) * item.quantity);
      }, 0);

      cartDrawerMeta.textContent = `共 ${quantity} 件商品`;
      cartDrawerItems.innerHTML = quantity === 0
        ? '<div class="cart-drawer__empty" data-cart-empty-state>购物车还是空的</div>'
        : cartState.items.map(createCartItemMarkup).join("");
      cartDrawerTotal.textContent = `¥${total}`;
    }

    function setCartDrawerOpen(nextState) {
      isCartDrawerOpen = nextState;
      cartDrawer.dataset.open = nextState ? "true" : "false";
      cartDrawer.setAttribute("aria-hidden", nextState ? "false" : "true");
      cartToggleButton.setAttribute("aria-expanded", nextState ? "true" : "false");
      document.body.classList.toggle("is-cart-drawer-open", nextState);
    }

    function setCartMutationPending(nextState) {
      isCartMutationPending = nextState;
      renderCartState();
    }

    function renderCartState() {
      const quantity = getCartQuantity(cartState.items);
      cartCount.textContent = String(quantity);
      cartSummary.textContent = `购物车 ${quantity} 件`;
      clearCartButton.disabled = quantity === 0 || isCartMutationPending;
      renderCartDrawer();
    }

    async function fetchCart() {
      const response = await fetch("/api/cart");

      if (!response.ok) {
        throw new Error("Failed to load cart");
      }

      const payload = await response.json();
      cartState = {
        items: Array.isArray(payload.items) ? payload.items : []
      };
      renderCartState();
      return payload;
    }

    function syncCartItem(item) {
      const existingItem = cartState.items.find((entry) => {
        return entry.productId === item.productId && entry.size === item.size;
      });

      if (existingItem) {
        existingItem.quantity = item.quantity;
      } else {
        cartState.items.push({
          productId: item.productId,
          size: item.size,
          quantity: item.quantity
        });
      }

      renderCartState();
    }

    async function addCartItem(productId, size) {
      setCartMutationPending(true);

      try {
        const response = await fetch("/api/cart/items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            productId,
            size,
            quantity: 1
          })
        });

        if (!response.ok) {
          throw new Error("Failed to add cart item");
        }

        const payload = await response.json();
        syncCartItem(payload.item);
        return payload;
      } finally {
        setCartMutationPending(false);
      }
    }

    async function updateCartItem(productId, size, quantity) {
      setCartMutationPending(true);

      try {
        const response = await fetch("/api/cart/items", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            productId,
            size,
            quantity
          })
        });

        if (!response.ok) {
          throw new Error("Failed to update cart item");
        }

        const payload = await response.json();
        syncCartItem(payload.item);
        return payload;
      } finally {
        setCartMutationPending(false);
      }
    }

    async function removeCartItem(productId, size) {
      setCartMutationPending(true);

      try {
        const response = await fetch("/api/cart/items", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            productId,
            size
          })
        });

        if (!response.ok) {
          throw new Error("Failed to remove cart item");
        }

        const payload = await response.json();
        cartState = {
          items: Array.isArray(payload.items) ? payload.items : []
        };
        renderCartState();
        return payload;
      } finally {
        setCartMutationPending(false);
      }
    }

    async function clearCart() {
      setCartMutationPending(true);

      try {
        const response = await fetch("/api/cart/clear", {
          method: "POST"
        });

        if (!response.ok) {
          throw new Error("Failed to clear cart");
        }

        const payload = await response.json();
        cartState = {
          items: Array.isArray(payload.items) ? payload.items : []
        };
        renderCartState();
        return payload;
      } finally {
        setCartMutationPending(false);
      }
    }

    function showLoadFailureState() {
      productGrid.classList.add("is-empty");
      productGrid.innerHTML = '<div class="empty-state" data-empty-state>商品加载失败，请稍后重试</div>';
      resultCount.textContent = "共 0 件商品";
      syncToolbarState();
    }

    function syncToolbarState() {
      const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));
      const sortButtons = Array.from(document.querySelectorAll("[data-sort]"));

      filterButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === activeFilter);
      });

      sortButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.sort === activeSort);
      });
    }

    function bindCardInteractions() {
      const productCards = Array.from(productGrid.querySelectorAll("[data-product-card]"));

      productCards.forEach((card) => {
        const sizeButtons = Array.from(card.querySelectorAll("[data-size]"));
        const cartButton = card.querySelector("[data-cart-button]");
        const productId = card.dataset.productId;

        sizeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            sizeButtons.forEach((sizeButton) => {
              sizeButton.classList.remove("is-selected");
              sizeButton.setAttribute("aria-pressed", "false");
            });

            button.classList.add("is-selected");
            button.setAttribute("aria-pressed", "true");
          });
        });

        cartButton.addEventListener("click", async () => {
          const selectedSize = card.querySelector('[data-size][aria-pressed="true"]').textContent.trim();

          try {
            await addCartItem(productId, selectedSize);
            cartButton.textContent = "已加入购物车";

            if (cartFeedbackTimers.has(productId)) {
              window.clearTimeout(cartFeedbackTimers.get(productId));
            }

            const timerId = window.setTimeout(() => {
              cartButton.textContent = "加入购物车";
              cartFeedbackTimers.delete(productId);
            }, 1500);

            cartFeedbackTimers.set(productId, timerId);
          } catch (error) {
            cartButton.textContent = "加入购物车";
          }
        });
      });
    }

    async function renderProducts() {
      const visibleProducts = await fetchProducts();
      syncProductCatalog(visibleProducts);
      const isEmpty = visibleProducts.length === 0;

      productGrid.classList.toggle("is-empty", isEmpty);
      productGrid.innerHTML = isEmpty
        ? '<div class="empty-state" data-empty-state>当前分类暂无商品</div>'
        : visibleProducts.map(createCardMarkup).join("");
      resultCount.textContent = `共 ${visibleProducts.length} 件商品`;
      syncToolbarState();
      renderCartDrawer();

      if (!isEmpty) {
        bindCardInteractions();
      }
    }

    toolbar.addEventListener("click", async (event) => {
      const cartToggle = event.target.closest("[data-cart-toggle]");
      if (cartToggle) {
        setCartDrawerOpen(true);
        return;
      }

      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) {
        activeFilter = filterButton.dataset.filter;
        try {
          await renderProducts();
        } catch (error) {
          showLoadFailureState();
        }
        return;
      }

      const sortButton = event.target.closest("[data-sort]");
      if (sortButton) {
        activeSort = sortButton.dataset.sort;
        try {
          await renderProducts();
        } catch (error) {
          showLoadFailureState();
        }
      }
    });

    clearCartButton.addEventListener("click", async () => {
      try {
        await clearCart();
      } catch (error) {
        renderCartState();
      }
    });

    cartCloseButton.addEventListener("click", () => {
      setCartDrawerOpen(false);
    });

    cartBackdrop.addEventListener("click", () => {
      setCartDrawerOpen(false);
    });

    cartDrawer.addEventListener("click", async (event) => {
      const increaseButton = event.target.closest("[data-cart-increase]");
      if (increaseButton) {
        const productId = increaseButton.dataset.productId;
        const size = increaseButton.dataset.size;
        const item = cartState.items.find((entry) => {
          return entry.productId === productId && entry.size === size;
        });

        if (!item) {
          return;
        }

        try {
          await updateCartItem(productId, size, item.quantity + 1);
        } catch (error) {
          renderCartState();
        }
        return;
      }

      const decreaseButton = event.target.closest("[data-cart-decrease]");
      if (decreaseButton) {
        const productId = decreaseButton.dataset.productId;
        const size = decreaseButton.dataset.size;
        const item = cartState.items.find((entry) => {
          return entry.productId === productId && entry.size === size;
        });

        if (!item || item.quantity <= 1) {
          return;
        }

        try {
          await updateCartItem(productId, size, item.quantity - 1);
        } catch (error) {
          renderCartState();
        }
        return;
      }

      const removeButton = event.target.closest("[data-cart-remove]");
      if (removeButton) {
        try {
          await removeCartItem(removeButton.dataset.productId, removeButton.dataset.size);
        } catch (error) {
          renderCartState();
        }
      }
    });

    renderProducts().catch(() => {
      showLoadFailureState();
    });

    renderCartState();
    renderCartDrawer();
    fetchCart().catch(() => {
      renderCartState();
    });
  </script>
</body>
</html>
