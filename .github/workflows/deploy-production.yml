name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA that passed CI
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable revision
        shell: bash
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "commit_sha must be a full lowercase SHA" >&2
            exit 1
          fi
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT_SHA" --status success --limit 1 --json databaseId --jq 'length')"
          if [[ "$successful_runs" != "1" ]]; then
            echo "the requested commit has no successful CI run" >&2
            exit 1
          fi

      - name: Check out approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set immutable image name
        shell: bash
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "APP_IMAGE=${image_repository}:${COMMIT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push approved image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE }}

      - name: Configure pinned SSH trust
        shell: bash
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Synchronize non-secret deployment files
        shell: bash
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          target="${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}"
          ssh "$target" "mkdir -p /opt/socks-store/deploy /opt/socks-store/scripts"
          scp compose.production.yml "$target:/opt/socks-store/compose.production.yml"
          scp deploy/Caddyfile "$target:/opt/socks-store/deploy/Caddyfile"
          scp scripts/deploy-production.sh "$target:/opt/socks-store/scripts/deploy-production.sh"

      - name: Deploy approved image
        shell: bash
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          target="${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}"
          ssh "$target" "cd /opt/socks-store && chmod 700 scripts/deploy-production.sh && COMMIT_SHA='$COMMIT_SHA' APP_IMAGE='$APP_IMAGE' scripts/deploy-production.sh"
