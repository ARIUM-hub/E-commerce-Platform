name: socks-store

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-volumes: &app-volumes
  - ${DATA_DIR_HOST:-./data}:/app/data
  - ${UPLOAD_DIR_HOST:-./public/uploads}:/app/public/uploads
  - ${BACKUP_DIR_HOST:-./backups}:/app/backups

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file:
      - .env.production
    environment:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
    expose:
      - "4173"
    volumes: *app-volumes
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?STORE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  backup:
    profiles: ["ops"]
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file:
      - .env.production
    environment:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
    command: ["node", "scripts/backup-database.js"]
    volumes: *app-volumes
    restart: "no"
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
